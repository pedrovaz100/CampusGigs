server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campusgigs-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusgigs}
    username: ${DB_USER:campusgigs}
    password: ${DB_PASSWORD:campusgigs}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_JWT_SECRET_KEY_32_BYTES_MIN}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_PASSWORD:}
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}
    timeout-ms: ${VIACEP_TIMEOUT_MS:3000}

logging:
  level:
    org.hibernate.SQL: info
